<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">Chrono Action Registry 架构与确认流程</title>
  <desc id="desc">展示消费者、Action Registry、tool definitions、三类 action、风险判断、确认卡片和数据变更链路。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563" />
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d7dde6; stroke-width: 1.5; rx: 18; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .consumer { fill: #eef6ff; stroke: #3b82f6; }
      .registry { fill: #f4f0ff; stroke: #7c3aed; }
      .schema { fill: #fff7ed; stroke: #f97316; }
      .action { fill: #ecfdf5; stroke: #10b981; }
      .confirm { fill: #fff1f2; stroke: #e11d48; }
      .data { fill: #f0fdf4; stroke: #16a34a; }
      .decision { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .small { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .arrow { stroke: #4b5563; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="860" />
  <text class="title" x="40" y="52">Action Registry：本地工具层与确认安全边界</text>
  <text class="small" x="40" y="78">模型只看 tool schema；真正执行在本地 action handler；risk 决定是否必须经过用户确认。</text>

  <rect class="panel" x="30" y="112" width="1220" height="290" />
  <text class="section" x="54" y="142">架构关系</text>

  <rect class="box consumer" x="62" y="170" width="210" height="78" />
  <text class="label" x="103" y="198">AI toolCallEngine</text>
  <text class="small" x="92" y="219">当前消费者</text>
  <text class="small" x="92" y="239">控制 tool loop</text>

  <rect class="box consumer" x="62" y="280" width="210" height="72" />
  <text class="label" x="101" y="308">未来消费者</text>
  <text class="small" x="92" y="329">MCP adapter / UI shortcut</text>

  <rect class="box registry" x="390" y="155" width="280" height="212" />
  <text class="label" x="472" y="186">Action Registry</text>
  <text class="small" x="426" y="213">register(action)</text>
  <text class="small" x="426" y="235">get(name)</text>
  <text class="small" x="426" y="257">getByCategory(category)</text>
  <text class="small" x="426" y="279">toToolDefinitions()</text>
  <line x1="414" y1="296" x2="646" y2="296" stroke="#d8b4fe" />
  <text class="tiny" x="426" y="318">ActionDefinition:</text>
  <text class="tiny" x="426" y="338">name / description / parameters</text>
  <text class="tiny" x="426" y="356">category / risk / confirm / handler</text>

  <rect class="box schema" x="800" y="170" width="210" height="78" />
  <text class="label" x="842" y="198">Tool definitions</text>
  <text class="small" x="829" y="219">OpenAI-compatible schema</text>
  <text class="small" x="829" y="239">发给 LLM 判断调用</text>

  <rect class="box schema" x="800" y="280" width="210" height="72" />
  <text class="label" x="855" y="308">LLM 返回</text>
  <text class="small" x="838" y="329">tool_calls(name,args)</text>

  <rect class="box action" x="1055" y="154" width="155" height="64" />
  <text class="label" x="1097" y="183">read</text>
  <text class="small" x="1082" y="204">4 actions · none</text>

  <rect class="box confirm" x="1055" y="238" width="155" height="64" />
  <text class="label" x="1096" y="267">write</text>
  <text class="small" x="1076" y="288">8 actions · low/high</text>

  <rect class="box action" x="1055" y="322" width="155" height="64" />
  <text class="label" x="1081" y="351">maintenance</text>
  <text class="small" x="1079" y="372">5 actions · mixed</text>

  <path class="arrow" d="M272 208 H390" />
  <path class="arrow" d="M272 316 C320 316 338 275 390 260" />
  <path class="arrow" d="M670 207 H800" />
  <path class="arrow" d="M905 248 V280" />
  <path class="arrow dash" d="M800 320 C740 330 725 350 670 335" />
  <text class="tiny" x="704" y="354">tool name 回 registry 查找</text>
  <path class="arrow" d="M670 320 C790 330 915 190 1055 186" />
  <path class="arrow" d="M670 320 C790 330 930 270 1055 270" />
  <path class="arrow" d="M670 320 C790 330 930 354 1055 354" />

  <rect class="panel" x="30" y="430" width="1220" height="375" />
  <text class="section" x="54" y="460">确认与执行流程</text>

  <rect class="box schema" x="62" y="492" width="168" height="68" />
  <text class="label" x="98" y="520">tool_call</text>
  <text class="small" x="90" y="541">name + arguments</text>

  <rect class="box registry" x="285" y="492" width="178" height="68" />
  <text class="label" x="322" y="520">查找 action</text>
  <text class="small" x="320" y="541">registry.get(name)</text>

  <polygon class="decision" points="570,482 670,526 570,570 470,526" />
  <text class="label" x="527" y="522">risk?</text>
  <text class="tiny" x="516" y="543">none / low / high</text>

  <rect class="box action" x="745" y="462" width="180" height="72" />
  <text class="label" x="783" y="491">直接执行</text>
  <text class="small" x="774" y="512">risk: none</text>

  <rect class="box confirm" x="745" y="585" width="180" height="88" />
  <text class="label" x="786" y="613">生成确认卡</text>
  <text class="small" x="772" y="635">confirm(params)</text>
  <text class="small" x="772" y="655">ConfirmationCard</text>

  <rect class="box confirm" x="984" y="585" width="190" height="88" />
  <text class="label" x="1025" y="613">用户决策</text>
  <text class="small" x="1014" y="635">确认：继续 handler</text>
  <text class="small" x="1014" y="655">取消：返回取消结果</text>

  <rect class="box data" x="745" y="715" width="180" height="66" />
  <text class="label" x="790" y="743">数据层</text>
  <text class="small" x="766" y="764">dataService / stores / syncDb</text>

  <rect class="box data" x="984" y="715" width="190" height="66" />
  <text class="label" x="1023" y="743">ActionResult</text>
  <text class="small" x="1014" y="764">message 回到 tool message</text>

  <path class="arrow" d="M230 526 H285" />
  <path class="arrow" d="M463 526 H470" />
  <path class="arrow" d="M670 515 H745" />
  <text class="tiny" x="690" y="501">none</text>
  <path class="arrow" d="M570 570 C610 620 682 630 745 630" />
  <text class="tiny" x="613" y="608">low/high</text>
  <path class="arrow" d="M925 630 H984" />
  <path class="arrow" d="M1078 673 C1078 700 1026 712 925 748" />
  <text class="tiny" x="1016" y="697">确认</text>
  <path class="arrow" d="M835 534 V715" />
  <path class="arrow" d="M925 748 H984" />
  <path class="arrow dash" d="M1078 585 C1045 548 997 536 925 520" />
  <text class="tiny" x="996" y="552">取消：不写数据</text>

  <rect class="box" x="62" y="690" width="610" height="92" />
  <text class="label" x="88" y="720">安全边界</text>
  <text class="small" x="88" y="742">模型只请求 tool_call；是否写入由本地 risk 判断和用户确认决定。</text>
  <text class="small" x="88" y="764">没有 onConfirmRequired 的调用方，风险操作会被拒绝，不会静默执行。</text>

  <path class="arrow dash" d="M984 748 C820 820 450 825 146 560" />
  <text class="tiny" x="494" y="824">tool result 回到 LLM，再综合最终回答</text>
</svg>
